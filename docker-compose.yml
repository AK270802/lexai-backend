services:
  db:
    image: postgres:16-alpine
    container_name: lexai-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexai}
      POSTGRES_USER: ${POSTGRES_USER:-lexai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexai-network

  redis:
    image: redis:7-alpine
    container_name: lexai-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lexai-network

  minio:
    image: minio/minio:latest
    container_name: lexai-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lexai_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lexai-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - lexai-network

  ollama:
    image: ollama/ollama:latest
    container_name: lexai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lexai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexai-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-lexai}:${POSTGRES_PASSWORD:-lexai}@db:5432/${POSTGRES_DB:-lexai}
      - POSTGRES_DB=${POSTGRES_DB:-lexai}
      - POSTGRES_USER=${POSTGRES_USER:-lexai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lexai}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-lexai}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-lexai_secret}
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - lexai-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexai-worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-lexai}:${POSTGRES_PASSWORD:-lexai}@db:5432/${POSTGRES_DB:-lexai}
      - POSTGRES_DB=${POSTGRES_DB:-lexai}
      - POSTGRES_USER=${POSTGRES_USER:-lexai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lexai}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-lexai}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-lexai_secret}
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434
      - FRONTEND_URL=http://localhost:3000
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    depends_on:
      - db
      - redis
    networks:
      - lexai-network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: lexai-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:8000/api
  #     - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
  #   depends_on:
  #     - backend
  #   networks:
  #     - lexai-network

networks:
  lexai-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  ollama_data:
